name: ventas-banguat

x-app: &app
  image: ${APP_IMAGE:-ventas-banguat:local}
  environment:
    DB_HOST: db
    DB_NAME: ventas
    DB_USER: estudiante
    # Valores públicos de demostración local; no usar con datos reales.
    DB_PASSWORD: ${DB_PASSWORD:-demo-academica}
  networks:
    - app

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ventas
      MYSQL_USER: estudiante
      MYSQL_PASSWORD: ${DB_PASSWORD:-demo-academica}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  init:
    <<: *app
    command: ["php", "bin/init-db.php"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/api.php?resource=health') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  app:

